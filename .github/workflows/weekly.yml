name: weekly-link-check-and-deploy
on:
  schedule: [{cron: "17 11 * * 1"}]   # Mondays ~6:17 AM Eastern
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Check Amazon links (weekly run only)
        if: github.event_name != 'push'
        run: python3 lcg.py check-links || echo "DEAD_FOUND=1" >> $GITHUB_ENV
      - name: Build site
        env: {AFF_TAG: "${{ vars.AFF_TAG }}"}
        run: python3 lcg.py build
      - name: Commit link status
        if: github.event_name != 'push'
        run: |
          git config user.name "link-bot"; git config user.email "link-bot@users.noreply.github.com"
          git add data/products.json data/link-report.json && git commit -m "weekly link check" && git push || true
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
