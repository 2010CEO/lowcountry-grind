<article class="ticket" id="${asin}">
<div class="stub"><span class="lbl">ORDER</span><span class="no">#${num}</span>${glyph}</div>
<div class="tbody">
<span class="award">${award}</span>
<h3>${name}</h3><div class="brand">${brand}</div>
<p class="verdict">${verdict}</p>
<div class="specs">${specs}</div>
<div class="pc"><div class="pro"><h4>Why it's here</h4><ul>${pros}</ul></div><div class="con"><h4>Skip it if</h4><ul>${cons}</ul></div></div>
<div class="buy"><a class="cta" href="${link}" rel="sponsored nofollow noopener" target="_blank">Check current price on Amazon</a><small>Best for: ${best_for}</small></div>
</div></article>
